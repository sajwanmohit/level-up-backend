spring:
  application:
    name: level-up-backend
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  port: ${PORT:${SERVER_PORT:8080}}
app:
  auth:
    jwt-signing-key: ${JWT_SIGNING_KEY}
    token-expiration-seconds: ${AUTH_TOKEN_EXPIRATION_SECONDS}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
logging:
  pattern:
    level: "%5p [request_id:%X{requestId:-}]"
